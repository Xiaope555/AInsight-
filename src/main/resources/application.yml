server:
  port: 8080

spring:
  application:
    name: ainsight
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true: required by MySQL 8.4 caching_sha2_password auth without SSL
    url: jdbc:mysql://localhost:3306/ainsight?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ainsight123
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    # dev only: print executed SQL to console
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- custom properties ----
ainsight:
  jwt:
    # HS256 requires a key of >= 32 bytes.
    # Dev value only: in production inject via environment variable, never commit real secrets.
    secret: "ainsight-demo-secret-please-change-me-0123456789abcdef"
    expire-minutes: 1440   # 24h, convenient for development
  llm:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # Reads env var AINSIGHT_LLM_API_KEY. NEVER commit a real key to Git.
    api-key: ${AINSIGHT_LLM_API_KEY:sk-replace-me}
    chat-model: qwen-plus
    embedding-model: text-embedding-v4   # stage 5, 1024-dim by default
    timeout-seconds: 60
    temperature: 0.7
    agent-temperature: 0.2   # tool calling needs precision, not creativity

# ---- API docs ----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: default
      packages-to-scan: com.ainsight

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.ainsight: debug
